<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>起稿台 / Home · 桌面 + 移动 · 空库 + 有稿</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="ds/theme.css" />
<style>
  html, body { margin: 0; height: 100%; background: #f0eee9; }
  /* contain each artboard's sticky/overflow inside its own frame */
  .frame { position: relative; height: 100%; overflow: hidden; border-radius: inherit; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ds/icons.jsx"></script>
<script type="text/babel" src="ds/ui.jsx"></script>
<script type="text/babel" src="home/HomeSurface.jsx"></script>
<script type="text/babel">
function App() {
  return (
    <DesignCanvas>
      <DCSection id="desktop" title="起稿台 / Home · 桌面" subtitle="sticky hero 永远给三条创建路径(AI 主 · 模板 · 空白)· 下方按文章数分支">
        <DCArtboard id="d-empty" label="桌面 · 空库 + 首访(firstVisit)" width={1280} height={1000}>
          <div className="frame"><HomeSurface firstVisit={true} initialArticles={[]} /></div>
        </DCArtboard>
        <DCArtboard id="d-has" label="桌面 · 有稿 · 最近的文章(点删除可触发二次确认)" width={1280} height={1380}>
          <div className="frame"><HomeSurface firstVisit={false} initialArticles={SEED_ARTICLES} /></div>
        </DCArtboard>
      </DCSection>
      <DCSection id="mobile" title="起稿台 / Home · 390px" subtitle="<600px:hero 字号 clamp · 三路径与网格强制单列 · 底部 2-tab 导航">
        <DCArtboard id="m-empty" label="390 · 空库 + 首访" width={390} height={2030}>
          <div className="frame"><HomeSurface narrow={true} firstVisit={true} initialArticles={[]} /></div>
        </DCArtboard>
        <DCArtboard id="m-has" label="390 · 有稿 · 最近的文章" width={390} height={2790}>
          <div className="frame"><HomeSurface narrow={true} firstVisit={false} initialArticles={SEED_ARTICLES} /></div>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
