<h1>Animated hero</h1>
<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1"><stop offset="0" stop-color="#f00"/></linearGradient>
  </defs>
  <circle cx="100" cy="100" r="80" fill="url(#g1)">
    <animate attributeName="opacity" from="0" to="1" dur="2s" begin="click"/>
  </circle>
</svg>
<p>After the svg.</p>
