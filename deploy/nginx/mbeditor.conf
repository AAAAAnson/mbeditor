# /etc/nginx/sites-available/mbeditor
# Public template: replace SERVICE_DOMAIN and TLS paths before installing.
#
# This file intentionally avoids real public hostnames and certificate paths.

server {
    listen 80;
    listen [::]:80;
    server_name SERVICE_DOMAIN;

    # ACME challenge root is shared with certbot's default; redirect everything else.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name SERVICE_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/SERVICE_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVICE_DOMAIN/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Large enough for a 50 MB image upload (backend MAX_UPLOAD_SIZE).
    client_max_body_size 55M;

    # Everything proxies to the frontend container; the frontend's embedded
    # nginx forwards /api/ and /images/ to the backend via the compose network.
    location / {
        proxy_pass http://127.0.0.1:7073;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-safe even though prod has no HMR.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
