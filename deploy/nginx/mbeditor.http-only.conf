# Temporary HTTP-only vhost for certbot first-issue.
# Public template: replace SERVICE_DOMAIN before installing.
# After certbot runs successfully, replace this with deploy/nginx/mbeditor.conf.
server {
    listen 80;
    listen [::]:80;
    server_name SERVICE_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
